<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="星球合成">
  <title>星球合成计划</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <a class="back-link" href="index.html">返回首页</a>
        <p id="levelNumber" class="eyebrow">LEVEL 01</p>
        <h1 id="levelTitle">幸福关</h1>
      </div>
      <div class="header-actions">
        <button id="soundButton" class="icon-button" type="button" aria-label="切换音效">音效 开</button>
      </div>
    </header>

    <section class="score-row" aria-label="游戏分数">
      <div class="score-card active">
        <span>本局得分</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-card">
        <span>最高纪录</span>
        <strong id="bestScore">0</strong>
      </div>
    </section>

    <div id="currentPlayer" class="current-player" aria-live="polite">尚未选择玩家</div>

    <div id="gameControls" class="game-controls" aria-label="游戏控制">
      <button id="pauseButton" type="button">暂停</button>
      <button id="resumeButton" type="button" disabled>继续</button>
      <button id="endGameButton" class="danger-button" type="button">结束游戏</button>
      <label class="sensitivity-setting">
        <span>灵敏度</span>
        <select id="sensitivitySelect" aria-label="选择操控灵敏度">
          <option value="0.5">0.5</option>
          <option value="0.75">0.75</option>
          <option value="1" selected>1.0</option>
          <option value="1.5">1.5</option>
          <option value="2">2.0</option>
        </select>
      </label>
    </div>

    <section class="canvas-wrap">
      <canvas id="gameCanvas" width="420" height="680" aria-label="星球合成游戏区域"></canvas>
      <div id="countdownOverlay" class="countdown-overlay" aria-live="assertive">
        <strong id="countdownNumber">3</strong>
        <span>准备继续</span>
      </div>
      <div id="encouragementOverlay" class="encouragement-overlay" aria-live="polite">
        <span class="encouragement-spark">✦</span>
        <strong id="encouragementText">你做得真棒！</strong>
        <span class="encouragement-spark">✦</span>
      </div>
      <div id="startOverlay" class="overlay visible">
        <div class="overlay-card">
          <div class="hero-orbit"><span></span></div>
          <p class="eyebrow">准备发射</p>
          <h2 id="startTitle">合成你的宇宙</h2>
          <p class="player-prompt">请选择本局玩家</p>
          <div class="player-options" role="group" aria-label="选择玩家">
            <button class="player-option female" type="button" data-player="xuehuhu">
              <span class="player-icon" aria-hidden="true">♀</span>
              <strong>xuehuhu</strong>
            </button>
            <button class="player-option male" type="button" data-player="buhuhu">
              <span class="player-icon" aria-hidden="true">♂</span>
              <strong>buhuhu</strong>
            </button>
          </div>
          <p>点击开始后，小球会自动掉落。按住游戏区域左右滑动，可以控制正在下落的小球。</p>
          <button id="startButton" class="primary-button" type="button" disabled>选择玩家后开始</button>
        </div>
      </div>
      <div id="gameOverOverlay" class="overlay">
        <div class="overlay-card result-card">
          <p class="eyebrow">任务结束</p>
          <h2 id="gameOverTitle">星轨已满</h2>
          <p class="final-label">本局得分</p>
          <strong id="finalScore" class="final-score">0</strong>
          <p id="recordMessage" class="record-message">再来一次，创造新纪录</p>
          <button id="restartButton" class="primary-button" type="button">重新开始</button>
          <a class="home-button" href="index.html">回到主页</a>
        </div>
      </div>
    </section>

    <footer>
      <span><i class="mouse-icon"></i> 按住并左右滑动控制方向</span>
      <span>相同星球碰撞即可合成</span>
    </footer>
  </main>
  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
