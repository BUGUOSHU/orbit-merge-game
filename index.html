<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8eee7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>幸福合成计划</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main class="home-shell">
    <header class="home-header">
      <p class="eyebrow">OUR LITTLE UNIVERSE</p>
      <h1>幸福合成计划</h1>
      <p class="intro">把一起走过的每个瞬间，合成一颗更大的幸福。</p>
    </header>

    <section class="memory-strip" aria-label="照片回忆">
      <img src="assets/memory-2.jpg" alt="幸福回忆">
      <img src="assets/memory-4.jpg" alt="幸福回忆">
      <img src="assets/memory-7.jpg" alt="幸福回忆">
    </section>

    <section class="levels">
      <div class="section-title">
        <span>选择关卡</span>
        <small>3 个关卡</small>
      </div>
      <a class="level-card" href="game.html?level=happiness">
        <div class="level-photo">
          <img src="assets/memory-5.jpg" alt="幸福关封面">
          <span class="level-number">01</span>
        </div>
        <div class="level-copy">
          <p>第一关</p>
          <h2>幸福关</h2>
          <span>合成我们的八段回忆</span>
        </div>
        <span class="play-button">开始</span>
      </a>
      <a class="level-card beauty-card" href="game.html?level=beauty">
        <div class="level-photo">
          <img src="assets/beauty-1.jpg" alt="美丽关封面">
          <span class="level-number">02</span>
        </div>
        <div class="level-copy">
          <p>第二关</p>
          <h2>美丽关</h2>
          <span>收集她的八个美丽瞬间</span>
        </div>
        <span class="play-button">开始</span>
      </a>
      <a class="level-card handsome-card" href="game.html?level=handsome">
        <div class="level-photo">
          <img src="assets/handsome-3.jpg" alt="帅气关封面">
          <span class="level-number">03</span>
        </div>
        <div class="level-copy">
          <p>第三关</p>
          <h2>帅气关</h2>
          <span>合成他的八个帅气瞬间</span>
        </div>
        <span class="play-button">开始</span>
      </a>
    </section>

    <section class="history-section">
      <div class="section-title">
        <span>历史得分</span>
        <small>最近记录</small>
      </div>
      <div class="history-grid">
        <article class="history-card female-history">
          <div class="history-head"><span class="history-icon">♀</span><strong>xuehuhu</strong></div>
          <div id="historyXuehuhu" class="history-list"></div>
        </article>
        <article class="history-card male-history">
          <div class="history-head"><span class="history-icon">♂</span><strong>buhuhu</strong></div>
          <div id="historyBuhuhu" class="history-list"></div>
        </article>
      </div>
    </section>

    <footer>每一次合成，都是一段回忆长大了。</footer>
  </main>
  <script src="home-audio.js"></script>
  <script src="history.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
